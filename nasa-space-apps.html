<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>InnoTech Council — NASA Space Apps</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #050608;
      color: #fff;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      overflow: hidden;
    }

    body {
      position: relative;
    }

    /* Background */
    .background {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .glow {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.12;
    }

    .glow.one {
      background: #ffffff;
      top: -250px;
      left: -150px;
    }

    .glow.two {
      background: #777;
      right: -250px;
      bottom: -250px;
    }

    /* Stars */
    .stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.7) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,.35) 1px, transparent 1px);
      background-size: 90px 90px, 150px 150px;
      background-position: 10px 20px, 40px 70px;
      opacity: 0.18;
    }

    /* Header */
    header {
      position: relative;
      z-index: 10;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      background: rgba(5,6,8,.85);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .logo {
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 11px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 17px;
      background: rgba(255,255,255,.06);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .brand-text strong {
      font-size: 15px;
      letter-spacing: .3px;
    }

    .brand-text span {
      font-size: 11px;
      color: #8e9299;
      margin-top: 4px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .event {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 12px;
      color: #aaaeb5;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    .status {
      width: 7px;
      height: 7px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(255,255,255,.8);
    }

    /* Main */
    main {
      position: relative;
      z-index: 2;
      height: calc(100vh - 76px);
      padding: 28px;
    }

    .form-shell {
      width: 100%;
      height: 100%;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      overflow: hidden;
      background: #fff;
      box-shadow:
        0 30px 80px rgba(0,0,0,.55),
        0 0 0 1px rgba(255,255,255,.02);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #fff;
    }

    @media (max-width: 700px) {
      header {
        height: 66px;
        padding: 0 18px;
      }

      .event {
        display: none;
      }

      main {
        height: calc(100vh - 66px);
        padding: 10px;
      }

      .form-shell {
        border-radius: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="background">
    <div class="stars"></div>
    <div class="glow one"></div>
    <div class="glow two"></div>
  </div>

  <header>
    <div class="brand">
      <div class="logo">IC</div>

      <div class="brand-text">
        <strong>InnoTech Council</strong>
        <span>NASA Space Apps</span>
      </div>
    </div>

    <div class="event">
      <div class="status"></div>
      Registration Portal
    </div>
  </header>

  <main>
    <div class="form-shell">

      <iframe
        src="https://docs.google.com/forms/d/e/1FAIpQLSfezotX9MpsTI4kkh3TQwfBiV2foReMr6C7aZHAmriOAc_vRw/viewform?embedded=true"
        loading="lazy"
        title="InnoTech Council NASA Space Apps Form">
        Loading…
      </iframe>

    </div>
  </main>

</body>
</html>
